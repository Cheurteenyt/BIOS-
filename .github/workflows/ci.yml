name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly drift canary (Monday 04:17 UTC): re-runs the MCP smoke against
    # the FLOATING 'mcp>=1.0,<2' range a user would actually install. If the
    # SDK drifted and the range broke, the canary turns red BEFORE any
    # machine does — then the exact pin below gets bumped. Day 0 is for
    # replay, not discovery; CI's job is to keep it that way.
    - cron: "17 4 * * 1"
  workflow_dispatch: {}

# Least privilege: the CI only needs to read the code.
permissions:
  contents: read

# One run per ref AND per event: superseded pushes are cancelled, runners
# stay free — and a manual canary dispatch never cancels a push run (they
# test different things: the exact pin vs the floating range).
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    # Runner pinned: ubuntu-latest will someday jump to a newer image and
    # silently change the environment under us. Reproducibility is a choice.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    name: test-suite (py${{ matrix.python }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Contract test suite (stdlib only, no hardware)
        run: python3 tests/test_suite.py

      - name: Selftest on fixtures
        run: python3 bin/omarchy-firmware selftest

      - name: Tier safety still holds (explicit invocation, no confirm)
        run: |
          python3 - <<'EOF'
          import json, subprocess, sys

          # Invariant: a T1 write invoked explicitly, WITHOUT --confirm,
          # must never modify the machine. The documented outcomes are:
          #   - refused  (exit 2, "REFUSED:" on stderr) — e.g. no EPP
          #     exposed on the runner (typical for cloud VMs);
          #   - dry-run  (exit 0, status "dry-run" in JSON) — when the
          #     hardware is present, the plan is shown, nothing written.
          # Any other outcome means the safety gate failed -> red CI.
          p = subprocess.run(
              [sys.executable, "bin/omarchy-firmware", "cpu", "epp",
               "set", "balance_performance", "--json"],
              capture_output=True, text=True)

          out = p.stdout + p.stderr
          try:
              payload = json.loads(p.stdout) if p.stdout.strip() else {}
          except json.JSONDecodeError:
              payload = {}
          status = payload.get("status", "")

          refused = p.returncode == 2 and "REFUSED" in out
          dryrun = p.returncode == 0 and status == "dry-run"
          assert refused or dryrun, (
              f"SAFETY GATE FAILED: rc={p.returncode}\n{out[:2000]}")
          print("T1 without --confirm:",
                "refused (no EPP on runner)" if refused else "dry-run",
                "-> nothing written.")

          # A T2 tool must stay declared and refused, never executed.
          p2 = subprocess.run(
              [sys.executable, "bin/omarchy-firmware", "tiers"],
              capture_output=True, text=True)
          assert "fw.update.stage" in p2.stdout and "T2" in p2.stdout, (
              f"T2 declaration missing:\n{p2.stdout[:2000]}")
          print("T2 tools remain declared and refused.")
          EOF

  mcp:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    name: mcp conformance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Exact pin, proven against the smoke + the full suite (handshake path)
      # before being committed here. The version FLOAT is exercised on a
      # schedule by the canary job below — never on a machine we care about.
      # Bump procedure: validate the new version locally against
      # tests/mcp_smoke.py, then change this pin in the same commit.
      - name: Install the pinned MCP SDK (exact, drift caught by the canary)
        run: pip install -q "mcp==1.30.0"

      - name: MCP smoke (initialize, tools/list, real calls, T1 dry-run)
        run: python3 tests/mcp_smoke.py

  canary:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    name: mcp drift canary (floating >=1.0,<2)
    concurrency:
      group: ci-canary
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the floating range exactly as a user would
        run: pip install -q "mcp>=1.0,<2"

      - name: MCP smoke against the floating SDK
        run: python3 tests/mcp_smoke.py
